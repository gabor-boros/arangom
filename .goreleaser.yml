version: 2
before:
  hooks:
    - make dep
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/arangom/main.go
    goos:
      - linux
      - windows
      - darwin
dist: bin
archives:
  - name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
checksum:
  name_template: 'checksums.txt'
signs:
  - artifacts: all
snapshot:
  version_template: "{{ incpatch .Version }}-next"
milestones:
  - close: true
    fail_on_error: true
changelog:
  disable: true
homebrew_casks:
  - name: arangom
    repository:
      owner: gabor-boros
      name: homebrew-brew
    directory: Casks
    commit_author:
      name: "Gabor Boros"
      email: gabor.brs@gmail.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/gabor-boros/arangom"
    description: "Run ArangoDB migrations with ease"
    skip_upload: auto
    binaries:
      - arangom
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/arangom"]
          end
